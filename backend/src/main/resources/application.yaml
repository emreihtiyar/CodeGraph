spring:
  application:
    name: CodeGraph

codegraph:
  # Analiz edilecek repolar (PRD FR-01). İki seçenek:
  #  1) Ayrı YAML dosyası (içindeki göreli yollar dosyanın dizinine göredir):
  repos-file: ./codegraph-repos.yml
  #  2) Doğrudan burada; doluysa repos-file okunmaz. Göreli yollar çalışma dizinine göredir.
  #     Değerler ortam değişkeniyle ezilebilir, ör. CODEGRAPH_REPOS_0_PATH=/repos/leasing-web
  # repos:
  #   - name: leasing-web
  #     path: ../repos/leasing-web
  #     layer: FRONTEND                    # FRONTEND | BFF | API | ADAPTER | LIBRARY
  #   - name: leasing-credit-bff
  #     path: ../repos/leasing-credit-bff
  #     layer: BFF
  #     gateway-prefix: leasing-credit-bff # opsiyonel; varsayılan servis adı
  #   - name: credit-api
  #     path: ../repos/credit-api
  #     layer: API
  #     service-name: credit-api           # opsiyonel; varsayılan spring.application.name
  #     aliases: [credit]                  # opsiyonel; Feign adı eşlemeleri
  # Çözülemeyen ${...} değerleri (ör. config server'dan gelen Feign adları); noktalı anahtarlar [ ] içinde.
  # Dosyadaki placeholders ile birleşir, çakışmada buradaki geçerlidir.
  # placeholders:
  #   "[clients.credit.name]": credit-api
  neo4j:
    data-dir: ./.codegraph/neo4j
  # MCP sunucusu (PRD §8.8), Streamable HTTP. stdio istemcileri için: java -jar … --mcp-stdio-bridge (docs/mcp.md)
  mcp:
    enabled: true
    endpoint: /mcp
    # Tarayıcıdan gelen isteklerde kabul edilen Origin'ler (DNS rebinding koruması); Origin'siz istemciler serbest.
    allowed-origins: ["http://localhost:*", "http://127.0.0.1:*"]

# Ayrıntılı analiz logu (docs/logging.md). Yorumu kaldır ya da çalıştırırken ver:
#   --logging.level.me.emreihtiyar.codegraph=DEBUG
# logging:
#   level:
#     me.emreihtiyar.codegraph: DEBUG                    # tüm analiz (UI, Java, bağlama)
#     me.emreihtiyar.codegraph.extract.ts: TRACE         # yalnızca UI analizi, dosya dosya
#   file:
#     name: ./.codegraph/codegraph.log                   # konsolla birlikte dosyaya da yaz
